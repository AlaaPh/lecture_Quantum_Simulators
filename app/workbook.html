<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quantum Simulators Workbook</title>
<meta name="description" content="Workbook of the Quantum Simulators course: the exercises as small questions, one on the screen at a time, each checked at once.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400;1,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="steps-page">
  <header class="top">
    <h1>Workbook</h1>
    <nav class="acts" id="parts" aria-label="Parts"></nav>
    <span class="spacer"></span>
    <button class="theme-btn" id="theme-btn" type="button" title="Switch between light and dark">Theme</button>
  </header>
  <main class="steps-main">
    <section class="step-card" id="card" aria-live="polite"></section>
    <figure class="step-pic"><canvas id="pic" role="img" aria-labelledby="pic-cap"></canvas><figcaption id="pic-cap"></figcaption></figure>
  </main>
</div>
<script type="module" src="js/workbook/main.js"></script>
</body>
</html>
