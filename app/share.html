<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quantum Simulators · scan to open</title>
<meta name="description" content="QR code and address of the Quantum Simulators exercise app, for projecting in the lecture.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root { --bg: #ffffff; --fg: #111111; --fg-2: #555555; --line: #dddddd; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141518; --fg: #f2f2f2; --fg-2: #a9adb5; --line: #33363c; } }
  :root[data-theme="dark"] { --bg: #141518; --fg: #f2f2f2; --fg-2: #a9adb5; --line: #33363c; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: "IBM Plex Sans", system-ui, sans-serif; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
  main { text-align: center; max-width: 100%; }
  h1 { font-weight: 600; font-size: clamp(22px, 4vw, 40px); margin: 0 0 6px; }
  p { color: var(--fg-2); margin: 0 0 24px; font-size: clamp(15px, 2vw, 20px); }
  img { width: min(70vmin, 560px); height: auto; display: block; margin: 0 auto 24px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  a { font-family: "IBM Plex Mono", monospace; font-size: clamp(14px, 2.4vw, 26px); color: var(--fg); word-break: break-all; }
  @media print { img { border: 0; } }
</style>
</head>
<body>
<main>
  <h1>Quantum Simulators · Exercise 1</h1>
  <p>Scan with the phone camera, or type the address.</p>
  <img src="qr/exercise1.svg" alt="QR code linking to the exercise app">
  <a href="https://alaaph.github.io/lecture_Quantum_Simulators/">alaaph.github.io/lecture_Quantum_Simulators</a>
</main>
</body>
</html>
