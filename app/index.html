<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quantum Simulators Lab</title>
<meta name="description" content="Interactive companion to the Quantum Simulators lecture: states as vectors, Hamiltonians as matrices, eigenvectors, measurement, time evolution and bands, built on a three-site chain you can see.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400;1,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <h1>Quantum Simulators Lab</h1>
    <span class="sub">from three sites to bands</span>
    <span class="spacer"></span>
    <button class="theme-btn" id="theme-btn" type="button" title="Switch between light and dark">Theme</button>
  </header>
  <div class="layout">
    <nav class="rail" id="rail" aria-label="Chapters"><div class="eyebrow">Chapters</div></nav>
    <div class="content">
      <section class="stage" id="stage" aria-label="Visualization">
        <div class="view3d" id="view3d"></div>
        <div class="stage2d" id="stage2d" hidden></div>
        <div class="hint" id="hint">drag to orbit · scroll to zoom · double-click to reset</div>
      </section>
      <section class="panel" id="panel-wrap" aria-live="polite">
        <div id="panel"></div>
        <div class="controls" id="controls"></div>
        <div class="pager" id="pager"></div>
      </section>
    </div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
