# GitLab Pages: publishes app/ as the site root on every push to the default branch.
# The URL appears in the GitLab project under Deploy → Pages after the first green pipeline.
pages:
  stage: deploy
  image: alpine:3.20
  script:
    - rm -rf public
    - cp -r app public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
